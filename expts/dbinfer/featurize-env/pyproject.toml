# The environment stage 2 runs in, as its own pixi project.
#
# It cannot share the repo's env: rdblearn pins Python >=3.12,<3.13 and pulls
# relbench 2.1.2 plus autogluon-adjacent deps, which conflict with the repo's
# relbench-hf and its 3.14 interpreter. Keeping it a separate manifest means the
# dependency set is declared and reviewable rather than an inline pip line, and
# `pixi install --manifest-path` builds it inside the job's clone -- node-local,
# unshared, removed with the clone -- exactly as the data-scaling jobs build theirs.
#
# fastdfs is the DFS engine rdblearn calls. Two caps are load-bearing, both from
# featuretools/woodwork underneath it: pandas <3, and setuptools <81 -- woodwork's
# top-level import still does `import pkg_resources`, which setuptools 81 removed.

[project]
name = "dbinfer-featurize"
version = "0.0.0"
requires-python = ">=3.12,<3.13"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
rdblearn = "*"
fastdfs = "*"
duckdb = "*"
pyarrow = "*"
pandas = "<3"
scikit-learn = "*"
loguru = "*"
setuptools = "<81"
