[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "relational-transformer"
version = "1.1.0"
description = "Relational Transformer (RT): a foundation model for relational data, bundling a native Rust data-processing engine (rt.rustler)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "beartype",
    "einops",
    "huggingface-hub",
    "matplotlib",
    "ml_dtypes",
    "numpy",
    "orjson",
    "pandas",
    "polars",
    "pre-commit",
    "pyarrow",
    "pytest",
    "pyyaml",
    "safetensors",
    "scikit-learn<1.6",
    "sentence-transformers",
    "torch",
    "tqdm",
    "wandb",
    "xgboost",
]

[tool.maturin]
python-source = "src"
manifest-path = "rustler/Cargo.toml"
module-name = "rt.rustler"
# The whole crate, FAISS aside (`vecdb` needs cmake and a BLAS; see rustler/Cargo.toml).
features = ["pyo3/extension-module"]
# roach.slurm ships a batch-script template and the node env setup alongside its .py
include = ["src/roach/slurm/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `examples.*` and `expts.*` import the same way in a test as
# they do in a job (roach targets are module paths relative to the checkout).
pythonpath = ["."]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = ">=3.12"
rust = "*"
maturin = "*"
uv = "*"

[tool.pixi.pypi-dependencies]
relational-transformer = { path = ".", editable = true }
# pinned until the relbench-hf branch (HF Hub data loading) lands in a relbench release
relbench = { git = "https://github.com/snap-stanford/relbench.git", rev = "6e4a3a3d271f981b7f61e2ecbb6fd1c0f1cd3eeb" }
