[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "relational-transformer"
version = "1.8.0"
description = "Relational Transformer (RT): a foundation model for relational data, bundling a native Rust data-processing engine (rt.rustler)."
readme = "README.md"
license = { file = "LICENSE" }
# 3.11, not 3.12: nothing in `src/` uses 3.12-only syntax or stdlib, and a
# consumer that pins 3.11 (relarena does, `~=3.11.0`) cannot resolve this
# package at all if the floor is 3.12. Development still happens on 3.12 --
# that is what `[tool.pixi.dependencies]` asks for.
requires-python = ">=3.11"
# Runtime only: what an `import rt.<something>` actually reaches for. Anything
# used by the repo's own tooling, experiments or plots belongs in `dev` below,
# so installing this package as a *library* (relarena does) does not drag a
# plotting stack and a pre-commit install into the consumer's environment.
dependencies = [
    "einops",
    "huggingface-hub",
    "ml_dtypes",
    "numpy",
    "orjson",
    "pandas",
    "polars",
    "pyarrow",
    "pyyaml",
    "safetensors",
    # mean_absolute_error / roc_auc_score in rt.eval only. The former `<1.6`
    # cap was inherited from a relbench pin, not from anything here.
    "scikit-learn",
    "sentence-transformers",
    "torch",
    # Imported at module scope by rt.train._train and rt.eval._eval, so it is a
    # hard runtime dependency even for a run with `wandb_disabled=True`.
    "wandb",
]

[project.optional-dependencies]
# The repo's own tooling and experiments: the test suite, the pre-commit hooks,
# the wandb workspace builder (expts/fine_tune/workspace.py), and the baselines
# and plots under expts/. None of it is imported from `src/rt`.
dev = [
    # Submits experiments and is the job-side entry point (roach.slurm.run);
    # pin and the submitting environment must agree (see its README).
    "roach @ git+https://github.com/rishabh-ranjan/roach@v0.3.5",
    # Builds the FAISS indices the sampler's opt-in vecdb feature reads
    # (expts/repaper/baselines/build_vector_db.py).
    "faiss-cpu",
    "lightgbm",
    "matplotlib",
    "pre-commit",
    "pytest",
    # TabICL v2, the in-context tabular predictor of the rel2tab baselines
    # (expts/repaper/baselines).
    "tabicl>=2.1.1,<3",
    "tqdm",
    "wandb-workspaces",
    "xgboost",
]

[tool.maturin]
python-source = "src"
manifest-path = "rustler/Cargo.toml"
module-name = "rt.rustler"
# The whole crate, FAISS aside (`vecdb` needs cmake and a BLAS; see rustler/Cargo.toml).
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `examples.*` and `expts.*` import the same way in a test as
# they do in a job (roach targets are module paths relative to the checkout).
pythonpath = ["."]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# conda-forge's rust package writes an activation script that bakes the
# environment's own prefix into the linker setting:
#
#   CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=<prefix>/bin/x86_64-conda-linux-gnu-cc
#
# Cargo hashes the per-target linker into every unit's fingerprint, including
# registry crates that never invoke a linker, so a checkout at a new path
# rebuilds the entire dependency tree however little changed. Pinning the bare
# name -- the same binary, resolved through PATH, which puts this environment's
# bin first -- makes the fingerprint independent of where the environment lives.
# Measured: a second checkout of the same commit went from 3m39s to 15s.
[tool.pixi.activation]
# Sourced on every activation (`pixi run`, `pixi shell`): rebuilds rt.rustler
# in place whenever anything under rustler/ changed since the last build, so
# the imported extension can never be stale.
scripts = ["rustler/develop.sh"]

[tool.pixi.activation.env]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "x86_64-conda-linux-gnu-cc"

[tool.pixi.dependencies]
# Only the sampler's opt-in `vecdb` cargo feature needs these (faiss-rs builds
# FAISS from source and links -lblas -llapack by their netlib names):
# `maturin develop --release --features vecdb`.
cmake = "*"
gxx = "*"
libblas = "*"
liblapack = "*"
openblas = "*"
# 3.12, not ">=3.12": on 3.14 the default multiprocessing start method on Linux
# is forkserver rather than fork, and a forkserver child is built by *pickling*
# the work over to it. rustler's Sampler is a pyo3 object and does not pickle,
# so every DataLoader with workers dies with
#
#   TypeError: cannot pickle 'builtins.Sampler' object
#
# rt assumes fork throughout (see the comment in rt/_env.py about workers
# inheriting the thread budget "at fork"). Pinning the interpreter is the
# smaller change than making every dataset picklable, and it also puts this
# environment inside relarena's own `requires-python`.
python = "3.12.*"
rust = "*"
maturin = "*"
uv = "*"

[tool.pixi.pypi-dependencies]
# This checkout, editable: `pixi install` builds the compiled extension
# (rt.rustler) into `src/rt/`, and rustler/develop.sh (see
# [tool.pixi.activation]) rebuilds it on activation whenever rustler/ changed.
relational-transformer = { path = ".", editable = true, extras = ["dev"] }
# RelBench 3 (stanford-star/relbench, `main`): `rt.eval.relbench` scores
# submissions through `relbench.submit` and `rt.data.datasets` resolves split
# timestamps through its `load_dataset`. Pinned to the released v3 commit; bump
# deliberately. The relarena branch pins `==2.1.2` instead (the package version
# is relarena's data version); that pin belongs to that branch, not to `main`.
relbench = { git = "https://github.com/stanford-star/relbench", rev = "bac62c99cf1a60fbfd7c61c5fd7cb183453b7997" }

# Baseline featurization (expts/repaper/baselines) runs against the classic
# relbench 2.x API (`relbench.datasets` / `relbench.tasks`), which the fork
# above does not carry, so it gets its own environment and the two pins never
# meet. `rdblearn` itself cannot be solved here -- its pins conflict with
# autogluon's -- and is fetched by the experiment's setup step
# (`uv pip install --no-deps ...`; see expts/repaper/baselines/README.md).
[tool.pixi.feature.featurize.dependencies]
python = "3.12.*"
uv = "*"
# fastdfs -> woodwork imports pkg_resources, which setuptools >= 81 dropped.
setuptools = "<81"

[tool.pixi.feature.featurize.pypi-dependencies]
# Jobs enter through `python -m roach.slurm.run` whatever environment they run in.
roach = { git = "https://github.com/rishabh-ranjan/roach", tag = "v0.3.5" }
relbench = "==2.1.2"
fastdfs = "*"
duckdb = "*"
numpy = "*"
pandas = "*"
pyarrow = "*"
scikit-learn = "*"
torch = "*"
tqdm = "*"

[tool.pixi.feature.featurize.tasks]
# rdblearn's pins conflict with autogluon's, so it is installed --no-deps on
# top of the solved environment; the commit hash pins what the solver cannot.
# Run once per checkout (jobs run it via `setup=`).
install-rdblearn = "uv pip install --python \"$CONDA_PREFIX/bin/python\" --no-deps git+https://github.com/ValterH/rdblearn@89bba03b1bacd5eaa884d1dc415703baed59f7f8 autogluon-features autogluon-common"

[tool.pixi.environments]
featurize = { features = ["featurize"], no-default-feature = true }
